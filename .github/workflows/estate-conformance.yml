name: Estate conformance

# Asks GitHub whether every repo in the estate still carries the .icm/.claude baseline.
#
# Why this exists as CI at all: the estate lives in `projects/`, which is gitignored, so
# `icm-check.sh` — the tool that answers this question by reading disk — only works on
# Jamie's machine. This job asks the API the same questions, which means it runs whether
# or not anyone opened a session, and it also sees repos that were never cloned locally.
#
# It reports and never writes. Fixing a gap is `icm-check.sh --fix` on the machine, or a
# ticket in the repo that has the gap — never an automated commit into someone's repo.

on:
  schedule:
    # 07:00 UTC daily — before the working day in Lisbon, so the summary is waiting.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: estate-conformance
  cancel-in-progress: false

jobs:
  conformance:
    name: Baseline across the estate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Actions' built-in GITHUB_TOKEN is scoped to this repo alone, so without a PAT the
      # run would report every estate repo as unreachable — a red run that says nothing
      # true. Fail early and say exactly what is missing instead.
      - name: Check the token exists
        env:
          ESTATE_TOKEN: ${{ secrets.ESTATE_TOKEN }}
        run: |
          if [ -z "$ESTATE_TOKEN" ]; then
            echo "::error title=No ESTATE_TOKEN::This workflow needs a fine-grained PAT with Contents+Metadata read across k0d0minio. See ticket ICM-005."
            exit 1
          fi

      - name: Check the estate
        env:
          GH_TOKEN: ${{ secrets.ESTATE_TOKEN }}
          ESTATE_OWNER: k0d0minio
        run: _system/scripts/estate-conformance.sh
