name: Self-check

# This repo enforces a baseline on ~20 others, so it holds itself to one too. Every check
# is fast:
#   - shellcheck over every script and hook. They are the estate's only executables and
#     they run against real repos with --fix; a quoting bug here does damage elsewhere.
#   - env-audit-stability.sh: the template's `env.sh audit` against a mock Vercel API that
#     rate-limits and pages — two runs byte-identical, an unreadable surface UNKNOWN, never
#     a gap. A nondeterministic audit makes every repo's `setup.sh --report` unstable.
#   - icm-sync-branch-guard.sh: icm-sync.sh --apply refuses to stamp a template commit
#     `origin/main` never held, unless --from-branch says so explicitly (triage/
#     icm-sync-stamps-unmerged-commit) — proven against a throwaway origin + target repo.
#   - close-out-working-tree.sh: the template's close-out.sh archives what is on disk, not
#     the index — the `usage-snapshot.sh … end` line appended just before it rides the move
#     (triage/template-close-out-archives-the-working-tree), against a mock GitHub API.
#   - self-check.sh: every relative markdown link resolves, and every ticket meets
#     contracts/TICKETS.md. This repo is almost entirely docs and contracts, so a dead
#     link IS a defect — it is the estate's named failure mode ("aspirational docs are
#     richer than the running system", _system/AUDIT.md) in miniature.
#
# Deliberately absent: any build, lint or test of application code. There is none here.
# (The audit fixture tests a template script, not an application.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Scripts + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Preinstalled on ubuntu-latest, but pinning the invocation keeps the failure
      # legible if that ever changes.
      - name: Shellcheck the estate scripts
        run: shellcheck --severity=warning _system/scripts/*.sh _system/scripts/lib/*.sh _system/hooks/*.sh

      - name: Links and ticket contract
        run: _system/scripts/self-check.sh

      - name: env.sh audit is deterministic
        run: _system/scripts/env-audit-stability.sh

      - name: icm-sync.sh refuses an unmerged template stamp
        run: _system/scripts/icm-sync-branch-guard.sh

      - name: close-out.sh archives the working tree
        run: _system/scripts/close-out-working-tree.sh
